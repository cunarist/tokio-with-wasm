[build]
# Tell Rust-analyzer to perform
# type checking and linting in webassembly mode.
# If you make any changes to this field,
# you might have to restart Rust-analyzer for the change to take effect.
target = "wasm32-unknown-unknown"

# Shared memory for web workers, so that `spawn_blocking` works
# in the example and the tests.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=1073741824",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base",
]

# `std` has to be rebuilt with `+atomics`, which needs nightly.
[unstable]
build-std = ["std", "panic_abort"]

# The default of 20 seconds for the whole web test binary is too short on a
# loaded machine.
[env]
WASM_BINDGEN_TEST_TIMEOUT = "120"
