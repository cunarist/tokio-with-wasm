name: Publish

# Pushing a version tag such as `v0.9.1` releases that version to crates.io.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Bump both crates together; the proc macro crate goes first.
      - run: cargo publish --package tokio_with_wasm_proc
      - run: cargo publish --package tokio_with_wasm
