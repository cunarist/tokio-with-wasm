name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Browser tests under the shared memory build
  # that `.cargo/config.toml` sets up.
  web32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # `tokio_unstable` reaches `task::Builder`, which `tokio` gates the same way.
      - run: cargo clippy --workspace --all-targets --features full,tracing --config 'target.wasm32-unknown-unknown.rustflags=["--cfg","tokio_unstable"]' -- -D warnings
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack test --headless --chrome package --config 'target.wasm32-unknown-unknown.rustflags=["--cfg","tokio_unstable"]'

  # `fs` reads the file system API of whichever engine is running it, and
  # the engines disagree on the edges of that API, so the tests run on a
  # second one. Firefox stands in for the engines that are not Chromium.
  web32-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack test --headless --firefox package

  # Safari is not covered: `safaridriver` needs a desktop session that hosted
  # runners lack.

  # Browser tests can't run on `wasm64` yet: `js-sys` fails under `+atomics`.
  web64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features full --target wasm64-unknown-unknown -- -D warnings

  # What users build: stable or the minimum Rust version, no shared memory,
  # and any single feature. Running from outside the repository keeps
  # `rust-toolchain.toml` and `.cargo/config.toml` out of it.
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --target wasm32-unknown-unknown
      - working-directory: ${{ runner.temp }}
        run: |
          for features in "" fs io-util macros rt rt-multi-thread sync time full; do
            cargo +${{ matrix.toolchain }} check \
              --manifest-path "$GITHUB_WORKSPACE/package/Cargo.toml" \
              --target wasm32-unknown-unknown ${features:+--features $features}
          done
          # Native builds only alias `tokio`.
          cargo +${{ matrix.toolchain }} check \
            --manifest-path "$GITHUB_WORKSPACE/package/Cargo.toml" --features full
        env:
          RUSTFLAGS: -D warnings

  # The same code paths compile to plain `tokio` on native platforms.
  native:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features full --target $TARGET -- -D warnings
      - run: cargo run -p example --target $TARGET
