name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Browser tests under the shared memory build
  # that `.cargo/config.toml` sets up.
  web32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features full -- -D warnings
      - run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: wasm-pack test --headless --chrome package

  # The same glue must also compile for 64-bit wasm, so that the target
  # gates keep picking the right side of the alias there. Browser tests
  # cannot run on `wasm64` yet: the shared memory build needs `+atomics`,
  # under which `js-sys` fails to compile because its waker hardcodes
  # `core::arch::wasm32`.
  web64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features full --target wasm64-unknown-unknown -- -D warnings

  # The same code paths compile to plain `tokio` on native platforms.
  native:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features full --target $TARGET -- -D warnings
      - run: cargo run -p example --target $TARGET
