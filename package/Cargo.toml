[package]
name = "tokio_with_wasm"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Mimicking tokio functionalities on web browsers"
repository = "https://github.com/cunarist/tokio-with-wasm"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
all-features = true

[features]
# https://github.com/tokio-rs/tokio/blob/master/tokio/Cargo.toml
default = []
full = ["macros", "sync", "time", "rt", "rt-multi-thread"]
macros = ["tokio/macros"]
sync = ["tokio/sync"]
time = ["tokio/time"]
rt = ["tokio/rt"]
# `tokio` refuses to build for `wasm32-unknown-unknown` with its
# `rt-multi-thread` feature on, and Cargo features cannot be made
# target specific, so this one cannot be forwarded. Enable
# `tokio/rt-multi-thread` in your own dependency on `tokio` instead.
rt-multi-thread = ["rt"]

[dependencies]
tokio_with_wasm_proc = "0.9.0"
tokio = "1.x.x"
wasm-bindgen = "0.2.95"
wasm-bindgen-futures = "0.4.45"
js-sys = "0.3.70"
web-sys = { version = "0.3.70", features = [
    'Worker',
    'WorkerOptions',
    'WorkerType',
    'DedicatedWorkerGlobalScope',
    'MessageEvent',
    'ErrorEvent',
    'Blob',
    "BlobPropertyBag",
    'Url',
] }

[dev-dependencies]
# The crate itself, so that the integration tests get its features.
tokio_with_wasm = { path = ".", features = ["full"] }
wasm-bindgen-test = "0.3"
js-sys = "0.3.70"
