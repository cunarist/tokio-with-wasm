[package]
name = "tokio_with_wasm"
version = "0.10.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Mimicking tokio functionalities on web browsers"
repository = "https://github.com/cunarist/tokio-with-wasm"
readme = "../README.md"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
all-features = true

[features]
# https://github.com/tokio-rs/tokio/blob/master/tokio/Cargo.toml
default = []
full = ["fs", "io-util", "macros", "sync", "time", "rt", "rt-multi-thread", "join-map"]
# `io-util`, `macros`, `sync`, and `rt` forward to `tokio`, because the
# glue code re-exports those parts of `tokio` even on the web
# (`rt` only for the runtime-independent `task_local!` machinery).
# The other features only gate glue modules implemented here;
# their native counterparts come from your own dependency on `tokio`,
# which needs the same features enabled (see the README).
io-util = ["tokio/io-util"]
macros = ["tokio/macros", "dep:tokio_with_wasm_proc"]
sync = ["tokio/sync"]
fs = [
  "web-sys/File",
  "web-sys/StorageManager",
  "web-sys/FileSystemHandleKind",
  "web-sys/FileSystemFileHandle",
  "web-sys/FileSystemDirectoryHandle",
  "web-sys/FileSystemGetFileOptions",
  "web-sys/FileSystemGetDirectoryOptions",
  "web-sys/FileSystemRemoveOptions",
  "web-sys/FileSystemCreateWritableOptions",
  "web-sys/FileSystemWritableFileStream",
]
time = []
rt = ["tokio/rt"]
rt-multi-thread = ["rt"]
# Like in `tokio`, `task::Builder` also needs `--cfg tokio_unstable`.
tracing = []
# `tokio-util`'s `JoinMap`, which lives in `task` here.
join-map = ["rt", "dep:hashbrown"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
tokio = "1.x.x"

# Native builds only alias `tokio`, so the glue's dependencies are wasm-only.
[target.'cfg(all(target_family = "wasm", target_vendor = "unknown", target_os = "unknown"))'.dependencies]
tokio_with_wasm_proc = { version = "0.10.1", optional = true }
# 0.2.96 is the first version with `thread_local_v2`.
wasm-bindgen = "0.2.96"
wasm-bindgen-futures = "0.4.46"
js-sys = "0.3.73"
web-sys = { version = "0.3.73", features = [
    'Worker',
    'WorkerOptions',
    'WorkerType',
    'DedicatedWorkerGlobalScope',
    'MessageEvent',
    'ErrorEvent',
    'Blob',
    "BlobPropertyBag",
    'Url',
] }
# Only `JoinMap` uses it.
hashbrown = { version = "0.16", default-features = false, optional = true }

[dev-dependencies]
# The crate itself, so that the integration tests get its features.
tokio_with_wasm = { path = ".", features = ["full", "tracing"] }
wasm-bindgen-test = "0.3"
js-sys = "0.3.73"
